version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: petit_tonnerre_db
    environment:
      POSTGRES_USER: petittonnerre
      POSTGRES_PASSWORD: petittonnerre
      POSTGRES_DB: petittonnerre_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petittonnerre"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: petit_tonnerre_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@petittonnerre.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json
      - ./pgpass:/pgadmin4/pgpass
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
