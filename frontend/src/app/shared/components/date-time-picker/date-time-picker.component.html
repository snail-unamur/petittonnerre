<div class="datetime-picker" [class.open]="isOpen">
  <!-- Trigger -->
  <div class="picker-trigger" (click)="togglePicker()">
    <div class="trigger-content">
      <span class="icon">📅</span>
      <span class="selected-value" *ngIf="selectedDate">
        {{ formattedDate }}
      </span>
      <span class="placeholder" *ngIf="!selectedDate">
        {{ placeholder }}
      </span>
    </div>
    <div class="trigger-actions">
      <button 
        type="button" 
        class="clear-btn" 
        *ngIf="selectedDate" 
        (click)="clearSelection($event)"
        title="Effacer"
      >
        ✕
      </button>
      <span class="dropdown-icon">▼</span>
    </div>
  </div>

  <!-- Picker Panel -->
  <div class="picker-panel" *ngIf="isOpen">
    <!-- Manual Input Section -->
    <div class="manual-input-section">
      <div class="manual-input-label">
        ✏️ Saisie manuelle
      </div>
      <input
        type="text"
        class="manual-input"
        [value]="formattedDate"
        (input)="onManualInput($event)"
        placeholder="JJ/MM/AAAA HH:MM"
        (click)="$event.stopPropagation()"
      />
      <div class="manual-input-hint">
        Format : 25/10/2025 14:30
      </div>
    </div>

    <div class="picker-content">
      <!-- Calendar Section -->
      <div class="calendar-section">
        <!-- Month Navigation -->
        <div class="month-header">
          <button type="button" class="nav-btn" (click)="previousMonth()">‹</button>
          <div class="month-title">
            {{ months[currentMonth.getMonth()] }} {{ currentMonth.getFullYear() }}
          </div>
          <button type="button" class="nav-btn" (click)="nextMonth()">›</button>
        </div>

        <!-- Week Days -->
        <div class="weekdays">
          <div class="weekday" *ngFor="let day of weekDays">{{ day }}</div>
        </div>

        <!-- Calendar Grid -->
        <div class="calendar-grid">
          <div
            *ngFor="let day of calendarDays"
            class="calendar-day"
            [class.empty]="day === null"
            [class.today]="isToday(day)"
            [class.selected]="isSelected(day)"
            [class.past]="isPastDay(day)"
            [class.disabled]="isPastDay(day)"
            (click)="selectDay(day)"
          >
            <span *ngIf="day !== null">{{ day }}</span>
          </div>
        </div>
      </div>

      <!-- Time Section -->
      <div class="time-section">
        <div class="time-label">🕐 Heure</div>
        
        <div class="time-selectors">
          <!-- Hours -->
          <div class="time-column">
            <div class="time-column-label">Heures</div>
            <div class="time-list">
              <div
                *ngFor="let hour of hours"
                class="time-item"
                [class.selected]="selectedHour === hour"
                (click)="selectHour(hour)"
              >
                {{ hour.toString().padStart(2, '0') }}
              </div>
            </div>
          </div>

          <!-- Separator -->
          <div class="time-separator">:</div>

          <!-- Minutes -->
          <div class="time-column">
            <div class="time-column-label">Minutes</div>
            <div class="time-list">
              <div
                *ngFor="let minute of minutes"
                class="time-item"
                [class.selected]="selectedMinute === minute"
                (click)="selectMinute(minute)"
              >
                {{ minute.toString().padStart(2, '0') }}
              </div>
            </div>
          </div>
        </div>

        <!-- Quick time buttons -->
        <div class="quick-times">
          <button type="button" class="quick-btn" (click)="selectHour(9); selectMinute(0)">
            09:00
          </button>
          <button type="button" class="quick-btn" (click)="selectHour(12); selectMinute(0)">
            12:00
          </button>
          <button type="button" class="quick-btn" (click)="selectHour(14); selectMinute(0)">
            14:00
          </button>
          <button type="button" class="quick-btn" (click)="selectHour(18); selectMinute(0)">
            18:00
          </button>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="picker-actions">
      <button type="button" class="btn-confirm" (click)="confirmSelection()" [disabled]="!selectedDate">
        ✓ Confirmer
      </button>
    </div>
  </div>
</div>

<!-- Overlay -->
<div class="picker-overlay" *ngIf="isOpen" (click)="togglePicker()"></div>
