<div class="app">
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <span class="logo-icon">🔧</span>
        <h1 class="logo-text">Petit Tonnerre</h1>
      </div>
      
      <!-- Menu burger (mobile) -->
      <button 
        class="menu-toggle" 
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Toggle navigation">
        <span class="hamburger" [class.open]="isMenuOpen">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
      
      <!-- Navigation -->
      <nav class="nav" [class.open]="isMenuOpen">
        <ul class="nav-list">
          <li class="nav-item">
            <a routerLink="/dashboard" 
               routerLinkActive="active" 
               class="nav-link"
               (click)="closeMenu()">
              <span class="nav-icon">📊</span>
              <span>Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/objects" 
               routerLinkActive="active" 
               class="nav-link"
               (click)="closeMenu()">
              <span class="nav-icon">📦</span>
              <span>Mes Objets</span>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/maintenance" 
               routerLinkActive="active" 
               class="nav-link"
               (click)="closeMenu()">
              <span class="nav-icon">🔧</span>
              <span>Maintenance</span>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/community" 
               routerLinkActive="active" 
               class="nav-link"
               (click)="closeMenu()">
              <span class="nav-icon">👥</span>
              <span>Communauté</span>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/problems" 
               routerLinkActive="active" 
               class="nav-link"
               (click)="closeMenu()">
              <span class="nav-icon">🔍</span>
              <span>Problèmes</span>
            </a>
          </li>
        </ul>
        
        <!-- User Menu -->
        <div class="user-menu" *ngIf="currentUser$ | async as user; else authButtons">
          <div class="user-dropdown">
            <button class="user-button" (click)="toggleUserMenu()">
              <span class="user-avatar">👤</span>
              <span class="user-name">{{ user.username }}</span>
              <span class="dropdown-icon">▼</span>
            </button>
            
            <div class="dropdown-menu" [class.open]="isUserMenuOpen">
              <a routerLink="/admin/dashboard" class="dropdown-item" (click)="closeMenus()" *ngIf="isAdmin()">
                <span>👨‍💼</span> Dashboard Admin
              </a>
              <a href="#" class="dropdown-item" (click)="closeMenus()">
                <span>⚙️</span> Paramètres
              </a>
              <a href="#" class="dropdown-item" (click)="closeMenus()">
                <span>👤</span> Profil
              </a>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item" (click)="logout()">
                <span>🚪</span> Déconnexion
              </a>
            </div>
          </div>
        </div>
        
        <ng-template #authButtons>
          <div class="user-menu">
            <div class="auth-buttons">
              <a routerLink="/auth/login" class="btn btn-ghost btn-sm" (click)="closeMenu()">
                Connexion
              </a>
              <a routerLink="/auth/register" class="btn btn-primary btn-sm" (click)="closeMenu()">
                S'inscrire
              </a>
            </div>
          </div>
        </ng-template>
      </nav>
    </div>
  </header>
  
  <!-- Overlay pour mobile -->
  <div class="overlay" 
       [class.show]="isMenuOpen" 
       (click)="closeMenu()"></div>
  
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
  
  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2025 Petit Tonnerre - Gestion d'entretien intelligente</p>
    </div>
  </footer>
</div>
